<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shahan — The Ledger of the Fourth Expedition</title>
<style>
:root{--bg:#161009;--pan:#241a10;--pan2:#2f2315;--parch:#ecdcb8;--ink:#1d130b;--gold:#e6b43c;--red:#d9553b;--green:#58b368;--blue:#58aee0;--mut:#b9a781;
--ra:#3fc2a8;--rd:#f0922f;--rm:#b98cf0;--rh:#78c4f2;--font:'Fondamento','Palatino Linotype',Palatino,Georgia,serif;--mono:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--parch);font-family:var(--font);overflow:hidden}
button{font-family:inherit;cursor:pointer}
#hud{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:14px;padding:0 14px;z-index:20;background:linear-gradient(#2d2113,#1f160c);border-bottom:2px solid #5a4126;box-shadow:0 4px 14px #000a}
#hud h1{margin:0;font-size:19px;letter-spacing:.5px;white-space:nowrap;color:var(--gold)}#hud h1 small{display:block;font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin-top:-2px}
#rank{display:flex;align-items:center;gap:10px;flex:1;max-width:430px;margin-left:8px}
#lvl{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5d27a,#b57a1c);color:#2b1a05;font-weight:700;font-size:19px;display:grid;place-items:center;border:2px solid #fff3;box-shadow:0 0 10px #e6b43c66;flex:none}
#rk{flex:1;min-width:0}#rkn{font-size:13px;display:flex;justify-content:space-between}#rkn span{color:var(--mut);font-size:11px}
#xpb{height:9px;background:#0007;border-radius:6px;margin-top:3px;overflow:hidden;border:1px solid #0009}#xpf{height:100%;width:0;background:linear-gradient(90deg,#e6b43c,#f6e08a,#e6b43c);background-size:200%;transition:width .7s;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.hb{background:#3a2a17;color:var(--parch);border:1px solid #6d4f2c;border-radius:8px;padding:6px 11px;font-size:13px}.hb:hover{background:#4a361e;border-color:var(--gold)}
#hud .sp{flex:1}
#stage{position:fixed;top:54px;left:0;right:0;bottom:0;background:#0c1a1e;touch-action:none;cursor:grab}#stage.drag{cursor:grabbing}
#map{width:100%;height:100%;display:block}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:8px;z-index:12;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 20px)}
.tab{background:#241a10ee;border:2px solid var(--c);color:var(--parch);border-radius:12px;padding:6px 12px;font-size:13px;text-align:left;min-width:150px;backdrop-filter:blur(3px)}
.tab b{display:block;color:var(--c);font-size:14px}.tab span{font-size:11px;color:var(--mut)}.tab.lock{opacity:.5;filter:grayscale(.7)}.tab:hover:not(.lock){background:#3a2a17}
.tab i{display:block;height:4px;background:#0008;border-radius:3px;margin-top:4px;overflow:hidden}.tab i u{display:block;height:100%;background:var(--c)}
#panel{position:fixed;top:54px;right:0;bottom:0;width:min(640px,100%);background:linear-gradient(#2b2013,#1d150c);border-left:3px solid #6b4d2a;z-index:15;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-10px 0 30px #000b}
#panel.open{transform:none}
#pin{padding:18px 20px 40px}
#px{position:absolute;right:12px;top:10px;background:none;border:none;color:var(--mut);font-size:26px}#px:hover{color:var(--gold)}
.chip{display:inline-block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;padding:2px 9px;border-radius:20px;border:1px solid var(--c,#999);color:var(--c,#999);margin-right:6px}
.chip.boss{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}.chip.mini{background:#a54a2c;border-color:#a54a2c;color:#fff}
h2.pt{margin:8px 0 2px;font-size:25px;color:var(--gold)}
.story{background:#0003;border-left:3px solid var(--c);padding:9px 12px;margin:10px 0;font-style:italic;line-height:1.5;color:#e2d3ae;font-size:15px}
.lesson{background:#16241f;border:1px solid #2f5a48;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:14px;line-height:1.5}.lesson b.h{color:#7fe0b4;text-transform:uppercase;letter-spacing:1.3px;font-size:11px;display:block;margin-bottom:3px}
code,.cd{font-family:var(--mono);background:#0006;padding:1px 5px;border-radius:4px;color:#ffd98a;font-size:.92em}
.task{background:var(--parch);color:var(--ink);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15.5px;line-height:1.5;box-shadow:inset 0 0 25px #8a6a2f55}.task b{color:#7a1f10}
.lives{float:right;font-size:22px;letter-spacing:2px;margin-right:34px}.lives .x{filter:grayscale(1) brightness(.45)}
.rnd{display:flex;gap:5px;margin:8px 0}.rnd i{flex:1;height:7px;border-radius:4px;background:#0007}.rnd i.on{background:var(--gold)}.rnd i.ok{background:var(--green)}
.grid{overflow:auto;max-height:290px;border:2px solid #0008;border-radius:6px;background:#fff;margin:8px 0}
.grid table{border-collapse:collapse;font-family:'Calibri','Segoe UI',Arial,sans-serif;font-size:13.5px;color:#111;min-width:100%}
.grid th{background:#e4e8e6;border:1px solid #c3c8c5;font-weight:600;color:#444;padding:2px 8px;position:sticky;top:0;z-index:1}.grid th.rh{position:sticky;left:0;z-index:2;width:34px;top:auto}
.grid td{border:1px solid #d6dbd8;padding:3px 8px;min-width:78px;height:24px;white-space:nowrap}.grid td.n{text-align:right}.grid td.fm{background:#f4f9f3}
.grid td.tg{background:#fff3c4;outline:2px solid #1e7a45;outline-offset:-2px;font-weight:700;cursor:text}.grid td.sp{color:#1e7a45;background:#eef9f0}.grid td.er{color:#b0261a;font-weight:700}
.fb{display:flex;gap:6px;align-items:center;margin:6px 0}.fb span{font-family:var(--mono);background:#1e7a45;color:#fff;border-radius:5px;padding:5px 9px;font-style:italic;font-size:14px}
.fb input,.ans{flex:1;font-family:var(--mono);font-size:15px;padding:8px 10px;border:2px solid #1e7a45;border-radius:6px;background:#fffefa;color:#111;min-width:0}
.btn{background:linear-gradient(#f0c75a,#c58a1e);color:#2a1904;border:none;border-radius:9px;padding:10px 20px;font-weight:700;font-size:15px;box-shadow:0 3px 0 #7a5410}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5410}
.btn.g{background:#3a2a17;color:var(--parch);box-shadow:0 3px 0 #1a1008;border:1px solid #6d4f2c;font-weight:400;padding:9px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.res{margin:10px 0;border-radius:10px;padding:10px 13px;font-size:14.5px;line-height:1.5}.res.bad{background:#401a14;border:1px solid var(--red)}.res.ok{background:#12301c;border:1px solid var(--green)}
.res b{display:block;margin-bottom:2px}.res .cmp{font-family:var(--mono);font-size:13px;margin-top:4px;color:#ffd98a}
.code{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:6px 0;margin:8px 0;font-family:var(--mono);font-size:13.5px;color:#d6e0ea;overflow:auto}
.code div{padding:1px 12px;display:flex;gap:12px;white-space:pre}.code div span{white-space:pre}.code div i{color:#5a6572;font-style:normal;width:20px;text-align:right;flex:none}.code.pk div{cursor:pointer}.code.pk div:hover{background:#26324a}.code div.sel{background:#5a2a2a}
.opts{display:grid;gap:7px;margin:8px 0}.opt{text-align:left;background:#3a2a17;border:2px solid #6d4f2c;color:var(--parch);border-radius:9px;padding:9px 12px;font-family:var(--mono);font-size:13.5px}.opt:hover{border-color:var(--gold)}.opt.sel{border-color:var(--gold);background:#5a4219}
.vk{color:#8cc8ff}.kw{color:#ff9d6e}.cm{color:#7b8a99}.st{color:#a5d6a7}
.ovl{position:fixed;inset:0;background:#000b;z-index:40;display:none;place-items:center;padding:16px}.ovl.on{display:grid}
.card{background:linear-gradient(#33261a,#20170e);border:3px solid var(--gold);border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px 26px;box-shadow:0 0 50px #e6b43c44;position:relative;animation:pop .4s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0 0 8px;color:var(--gold);font-size:28px;text-align:center}.card p{line-height:1.6;font-size:16px}
.big{font-size:64px;text-align:center;margin:4px 0}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}.bd{background:#0004;border:2px solid #4a3822;border-radius:12px;padding:10px 6px;text-align:center;font-size:12px}.bd .ic{font-size:34px;filter:grayscale(1) brightness(.4)}.bd b{display:block;margin-top:3px;font-size:13px}.bd.got{border-color:var(--gold);background:#3d2f12}.bd.got .ic{filter:none}.bd small{color:var(--mut);display:block;margin-top:2px}
.cx{max-height:60vh;overflow:auto;display:grid;gap:8px}.cx div{background:#0004;border-left:3px solid #4a3822;padding:7px 10px;font-size:13.5px;line-height:1.45}.cx div.u{border-color:var(--green)}.cx code{display:block;margin:3px 0}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;pointer-events:none}
.toast{background:#2b2013;border:2px solid var(--gold);border-radius:12px;padding:9px 16px;font-size:15px;animation:tin .4s,tout .5s 3.2s forwards;box-shadow:0 6px 20px #000a}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.mk{cursor:pointer}.mk:hover .mr{filter:brightness(1.25)}
@keyframes pu{0%,100%{r:19;opacity:.7}50%{r:27;opacity:0}}.gpulse{animation:pu 1.6s infinite}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:80;pointer-events:none;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(max-width:700px){#hud h1{display:none}#hud{gap:6px;padding:0 8px}.hb{padding:6px 7px;font-size:12px}#rkn span{display:none}#rank{margin-left:0}.tab{min-width:0;padding:5px 8px}.tab span{display:none}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-14}}
svg.nr .routes,svg.nd .dg,svg.nl .lbl,svg.nh .haz{display:none}svg:not(.hx) .hexg{display:none}svg.far .minor{display:none}
#gm .mk.sea .nm{display:none!important}#gm .nm{display:none}#gm.lab .mk.o .nm,#gm .mk:hover .nm{display:block}svg#map{width:100%;height:100%;display:block}
.scr{font-size:15px;line-height:1.55}.scr p{margin:8px 0}.scrl details{background:#0004;border-left:3px solid #7fe0b4;padding:8px 12px;margin:0}.scrl summary{cursor:pointer;font-size:16px;color:var(--gold)}.scrl details[open] summary{margin-bottom:6px}.cx.scrl{display:grid}.cx.scrl details div.scr{background:none;border:none;padding:0}
#wis{position:fixed;inset:0;z-index:60;background:rgba(10,6,2,.88);display:none;flex-direction:column}#wis.on{display:flex}#wis .wh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#2a1d0f;border-bottom:2px solid #6b5a3c;color:#f0c050;font:700 18px Georgia,serif}#wis iframe{flex:1;border:0;width:100%;background:#10141c}#wis .wx{background:#e8c25a;color:#2a1d0f;border:0;border-radius:8px;font:700 14px Georgia,serif;padding:7px 14px;cursor:pointer}.sw{animation:swv 5s ease-in-out infinite}@keyframes swv{0%,100%{opacity:.2}50%{opacity:.9}}#gm .mk .top{transition:transform .15s}#gm .mk:hover .top{transform:translateY(-3px)}#gm .eis{display:none}#gm.ez .eis{display:block}#gm.ez .ipin{display:none}#gm line.eis{display:none}#gm.ez line.eis{display:inline}</style></head><body>
<div id="hud"><h1>Shahan<small>Ledger of the Fourth Expedition</small></h1>
<div id="rank"><div id="lvl">1</div><div id="rk"><div id="rkn"><b id="rkt">Stray</b><span id="xpt">0 XP</span></div><div id="xpb"><div id="xpf"></div></div></div></div>
<div class="sp"></div><button class="hb" id="bBad">🏅 Badges</button><button class="hb" id="bScr">📜 Scripture</button><button class="hb" id="bWis">🧾 Wisdom Scroll</button><button class="hb" id="bCdx">📖 Codex</button><button class="hb" id="bWld">🗺 World</button><button class="hb" id="bHlp">?</button></div>
<div id="stage"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="tabs"></div>
<div id="panel"><button id="px">×</button><div id="pin"></div></div>
<div class="ovl" id="ovl"><div class="card" id="card"></div></div>
<div id="toasts"></div>
<script>
const MW=1200,MH=840,OFF=30,W=1260,H=900,NS='http://www.w3.org/2000/svg',LG=.3;
const svg=document.getElementById('map');
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let T,R;
const BASE_C={trunk:'#7a5230'};
const THEMES=[{id:'aged',name:'Aged Atlas',kind:'story',seed:7,font:"'Fondamento','Palatino Linotype',Georgia,serif",
 bg:'#2a2018',sea:['#58848c','#27474f'],ink:'#1d130b',text:'#24160b',halo:'#ecdcb8',lw:1.1,cw:2.8,wob:7,route:'#4a2a14',vig:.55,
 land:{h:'#ccd3d4',a:'#78986a',m:'#c9b583',d:'#cf9550'},shallow:'#6fa59c',
 c:{pine:'#2f6b45',oak:'#b9792a',rock:'#8c96a3',snow:'#f2f4f4',roof:'#a8432a',wall:'#e8d9b4',water:'#4f9bb5',leaf:'#5d9a62',gold:'#d9a93a',dune:'#b97d3e',cliff:'#9c5a34'}}];
/* ---------------- DRAWING HELPERS ---------------- */
const L=(w=1)=>`stroke="${T.ink}" stroke-width="${(w*T.lw).toFixed(2)}" stroke-linejoin="round" stroke-linecap="round"`;
const P=(d,f,w=1,x='')=>`<path d="${d}" fill="${f}" ${L(w)} ${x}/>`;
const C=(cx,cy,r,f,w=1)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${L(w)}/>`;
const E=(cx,cy,rx,ry,f,w=1)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${L(w)}/>`;
const Rr=(x,y,w,h,f,rx=0,lw=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${L(lw)}/>`;
const g=(x,y,s,inner,ex='')=>`<g transform="translate(${x} ${y}) scale(${s})" ${ex}>${inner}</g>`;
const gd=(x,y,s,dir,inner)=>`<g transform="translate(${x} ${y}) scale(${s*dir} ${s})">${inner}</g>`;
const tube=(d,col,w)=>`<path d="${d}" fill="none" stroke="${T.ink}" stroke-width="${w+2.4*T.lw}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const eye=(x,y,r=2.2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${T.ink}" stroke-width=".6"/><circle cx="${x+.4}" cy="${y+.3}" r="${r*.45}" fill="${T.ink}"/>`;
const cloud=(x,y,s=1)=>g(x,y,s,`<ellipse cx="0" cy="0" rx="11" ry="4.5" fill="#fff" ${L(.6)}/><circle cx="-4" cy="-3" r="4.5" fill="#fff" ${L(.6)}/><circle cx="3" cy="-4" r="5.5" fill="#fff" ${L(.6)}/><ellipse cx="0" cy="0" rx="10" ry="3.6" fill="#fff"/>`);
const star4=(x,y,r,f)=>`<path d="M${x},${y-r}Q${x},${y} ${x+r},${y}Q${x},${y} ${x},${y+r}Q${x},${y} ${x-r},${y}Q${x},${y} ${x},${y-r}Z" fill="${f}"/>`;

/* ---------------- ICONS ---------------- */
const IC={
mount:(x,y,s=1)=>g(x,y,s,P('M-22,0L-6,-30L4,-16L12,-26L28,0Z',T.c.rock)+P('M-6,-30L-12,-20L-6,-22L-2,-16L2,-21L4,-16Z',T.c.snow,.8)+P('M12,-26L7,-17L12,-19L16,-15L19,-18Z',T.c.snow,.8)),
pine:(x,y,s=1)=>g(x,y,s,Rr(-1.2,0,2.4,5,BASE_C.trunk,0,.6)+P('M-7,1L0,-12L7,1Z',T.c.pine,.8)+P('M-6,-5L0,-17L6,-5Z',T.c.pine,.8)+P('M-2.4,-13.6L0,-17L2.4,-13.6Z',T.c.snow,.3)),
oak:(x,y,s=1)=>g(x,y,s,P('M-4,4Q-3,-4-6,-10L6,-10Q3,-4,4,4Z',BASE_C.trunk,.8)+C(-9,-14,8,T.c.oak,.8)+C(9,-14,8,T.c.oak,.8)+C(0,-22,10,T.c.oak,.8)+C(0,-12,8,T.c.oak,.8)),
tree:(x,y,s=1)=>g(x,y,s,Rr(-1,0,2,5,BASE_C.trunk,0,.5)+C(0,-4,5.5,T.c.leaf,.7)),
cactus:(x,y,s=1)=>g(x,y,s,Rr(-9,-9,4,9,T.c.leaf,2,.7)+Rr(-9,-3,8,3.4,T.c.leaf,1.6,.6)+Rr(5,-12,4,10,T.c.leaf,2,.7)+Rr(1,-5,8,3.4,T.c.leaf,1.6,.6)+Rr(-2.8,-16,5.6,20,T.c.leaf,2.8,.8)),
dune:(x,y,s=1)=>g(x,y,s,P('M-18,0Q-8,-12,2,-4Q10,-10,20,0Z',T.c.dune,.7)),
palm:(x,y,s=1)=>g(x,y,s,`<path d="M0,5Q3,-5,-1,-14" fill="none" stroke="${BASE_C.trunk}" stroke-width="2.6" stroke-linecap="round"/>`+['M-1,-14Q-9,-21,-15,-12Q-8,-15,-1,-14Z','M-1,-14Q7,-22,15,-13Q8,-15,-1,-14Z','M-1,-14Q-4,-24,-12,-24Q-6,-19,-1,-14Z','M-1,-14Q4,-24,12,-23Q6,-19,-1,-14Z'].map(d=>P(d,T.c.leaf,.6)).join('')),
cypress:(x,y,s=1)=>g(x,y,s,Rr(-.8,0,1.6,4,BASE_C.trunk,0,.4)+E(0,-8,3.4,11,T.c.pine,.8)),
olive:(x,y,s=1)=>g(x,y,s,Rr(-1,0,2,5,BASE_C.trunk,0,.5)+E(0,-4,7,5,mix(T.c.leaf,'#c9d89a',.4),.7)),
house:(x,y,s=1,w,r)=>g(x,y,s,Rr(-5,-6,10,8,w||T.c.wall,0,.8)+P('M-7,-6L0,-13L7,-6Z',r||T.c.roof,.8)+Rr(-1.2,-2,2.4,4,BASE_C.trunk,0,.5)),
willow:(x,y,s=1)=>g(x,y,s,P('M-6,8Q-5,-6,-12,-18L12,-18Q5,-6,6,8Z',BASE_C.trunk,1)+E(0,-28,28,15,T.c.leaf,1)+[-22,-11,0,11,22].map(i=>`<path d="M${i},-22Q${i+2},-10,${i-1},0" fill="none" stroke="${T.c.leaf}" stroke-width="3.2" stroke-linecap="round"/>`).join('')+IC.house(-13,-30,.8)+IC.house(10,-33,.8)+IC.house(-1,-20,.7)),
isle:(x,y,s=1)=>IC.house(x,y,s),
temple:(x,y,s=1)=>g(x,y,s,Rr(-17,2,34,3.2,T.c.wall,0,.8)+[-12,-4,4,12].map(c=>Rr(c-1.7,-8,3.4,10,T.c.wall,0,.7)).join('')+Rr(-16,-11,32,3.2,T.c.wall,0,.8)+P('M-17,-11L0,-22L17,-11Z',T.c.roof,.8)+C(0,-15,2.2,T.c.gold,.5)),

{id:'elderglen',c:'h',x:610,y:140,icon:'elf',s:1.1,r:46,name:'Elderglen',type:'Last elven refuge',text:'Leaf-roofed towers and silver falls, beautiful the way a held breath is beautiful. The elves ran out of allies a century ago and kept the hospitality. Guests are welcome. Guests who stay past a season are asked questions.'},
{id:'snoring',c:'h',x:722,y:100,icon:'peak',s:.95,r:40,name:'Greyfang Peak',type:'Killer mountain',text:'The tallest summit in Shahan and its deadliest. Guides charge double for the descent, which tells you what they expect from the climb. The mountain rumbles at night. Nobody has asked what is down there.'},
{id:'oaks',c:'h',x:500,y:155,icon:'grove',s:1.2,r:44,name:'The Elder Oaks',type:'Ancient grove',text:'Trees older than the kingdoms that mapped them. They speak, slowly and without warmth, and they remember every axe. Take only fallen branches.'},
{id:'yetispa',c:'h',x:742,y:176,icon:'spa',s:1.1,r:34,name:'Boiling Springs',type:'Hot springs',text:'Volcanic pools tended by a yeti clan. The water cures frostbite, and the staff collects a toll in teeth. Surprisingly good massages, if you survive the check-in.'},
{id:'wyrm',c:'h',x:808,y:118,k:'danger',m:'wyrm',s:1.1,r:34,lvl:4,name:'Frieda the Frostwyrm',type:'Danger',text:'An ice dragon with a long memory and a short temper. She has razed two elven watchtowers and sent a polite letter about the third.'},
{id:'yetigang',c:'h',x:438,y:172,k:'danger',m:'yeti',s:1.2,r:30,lvl:2,name:'Rimefang Pack',type:'Danger',text:'Yeti raiders who strip travellers of everything, and occasionally of the travellers.'},
{id:'qart',c:'d',x:565,y:700,icon:'fall',s:1.25,r:62,name:'Qart-Mayim, City of Falls',type:'Merchant oligarchy',text:'A Carthage-style city built around a thundering waterfall and a circular harbor-pool at its heart. Water is currency here, and the Council of Hundred counts every drop. Rivals tend to vanish into the harbor.'},
{id:'sipsip',c:'d',x:722,y:702,icon:'oasis',s:1.1,r:34,name:'Well of Whispers',type:'Oasis',text:'A calm oasis where the water carries rumors. Drink, and you may learn who is plotting against you. Everyone drinks.'},
{id:'turtlerest',c:'d',x:440,y:742,icon:'oasis',s:1,r:32,name:'Shellrest Inn',type:'Oasis & inn',text:'Caravans rest here in the shade of their own turtles. Rooms are cheap. Do not ask what happened to the last innkeeper.'},
{id:'palmpocket',c:'d',x:372,y:690,icon:'oasis',s:.9,r:30,name:'Seven Palms',type:'Tiny oasis',text:'Seven palms, one spring and an unwritten rule: no one draws steel here. The rule has held because the last man to test it is buried under the sixth palm.'},
{id:'mimic',c:'d',x:470,y:655,k:'danger',m:'mimic',s:1.2,r:34,lvl:3,name:'Mirage Pond',type:'Danger',text:'A lovely oasis that is, in fact, a mimic. The sign saying FREE WATER is the lure. Dozens of travellers have taken the bait and stayed.'},
{id:'gerald',c:'d',x:660,y:752,k:'danger',m:'sandworm',s:1.2,r:34,lvl:4,name:'Gerald the Sandworm',type:'Danger',text:'The Devourer of Caravans. Locals call him Gerald because a worse name made it feel too real. Punctual, enormous, and always hungry at noon.'},
{id:'willowmoor',c:'a',x:172,y:392,icon:'willow',s:1.05,r:48,name:'Willowmoor',type:'Capital village',text:'Huts hung from an enormous weeping willow, tied by woven branch-bridges to every islet in the reach. The fish-riders gossip here. Gossip is the local currency, and the only one that does not sink.'},
{id:'nettlewick',c:'a',x:112,y:302,icon:'house',s:1.3,r:26,name:'Nettlewick',type:'Village',text:'Famous for nettle wine and for healers who know exactly how much is too much.'},
{id:'bobbin',c:'a',x:210,y:287,icon:'house',s:1.3,r:26,name:'Knotwater',type:"Weavers' village",text:'Every bridge in the reach was knotted here. The weavers hold that a bridge is a promise. They also hold grudges.'},
{id:'gillhaven',c:'a',x:276,y:424,icon:'house',s:1.3,r:26,name:'Gillhaven',type:'Fish stables',text:'Fish-riders train and race their mounts here. They bet on everything, including each other\'s survival.'},

{id:'mossy',c:'a',x:312,y:522,icon:'house',s:1.3,r:26,name:'Mossgrave',type:'Hamlet',text:'A hamlet built over a sunken graveyard. The moss grows thick on the oldest stones, and sometimes the stones move.'},
{id:'kelp',c:'a',x:122,y:484,icon:'house',s:1.3,r:26,name:'Kelp & Knife',type:'Seaweed market',text:'A seaweed and blade market under rope awnings. Smells of salt and bargains made under duress.'},

{id:'meteora',c:'m',x:816,y:386,icon:'meteora',s:1.05,r:44,name:'Meteora',type:'Sky libraries',text:'Libraries on stone pillars, tended by cloud nymphs. The elevator is a basket pulled by a satyr who has opinions about his pay.'},

{id:'eelmouth',c:'a',x:345,y:405,icon:'port',s:1,r:30,t:1,name:'Eelmouth Harbor',type:'Port',text:'The only deepwater port in the Reach, where Gravewater ferries dock and ask no questions. Eel pie is the local dish. Nobody asks what the eels eat.'},
{id:'cairn',c:'a',x:35,y:312,icon:'obelisk',s:.9,r:22,t:1,name:"Wrecker's Cairn",type:'False beacon',text:'A stone cairn where wreckers light a lantern on stormy nights. Its false glow has drawn forty ships onto the western rocks.'},

{id:'delphi',c:'m',x:960,y:380,icon:'oracle',s:1.2,r:30,name:"The Oracle's Navel",type:'Oracle',text:'A circular shrine where a god in a trance speaks in riddles for a price. The answers are always true. The questions are rarely the ones you thought you were asking.',ru:'Last season the oracle was silent for nine days, then answered a question nobody had asked.'},
{id:'titan',c:'m',x:1034,y:392,icon:'ruin',s:1.3,r:30,t:1,lvl:3,name:"Titan's Ruin",type:'Fallen temple',text:'The toppled temple of a titan who lost a war with the gods. Bones the size of columns litter the hillside, and the columns are not all stone.'},
{id:'labyrinth',c:'m',x:805,y:438,icon:'mine',s:1.1,r:28,lvl:4,name:'Labyrinth of Asterion',type:'Dungeon',text:'A maze beneath the western hills. Its architect was punished with it. Its resident has never been seen to leave, only to wait.',ru:'The maze rearranges itself on nights without a moon.'},
{id:'bacchanal',c:'m',x:925,y:418,icon:'vine',s:1.3,r:28,t:1,name:'Bacchanal Vineyards',type:'Divine vineyards',text:'Terraces where the wine god keeps his harvest and the satyrs keep the party going. Entry is free. Leaving is a matter of stamina.'},
{id:'lethe',c:'m',x:868,y:438,icon:'lake',s:1,r:26,t:1,name:'Lake Lethe',type:'Lake of forgetting',text:'A calm lake whose water erases a day for every sip. The nymphs call it merciful. Those who have forgotten why they came agree.'},
{id:'poseidon',c:'m',x:1042,y:436,icon:'oracle',s:.9,r:26,t:1,name:"Poseidon's Cape",type:'Sea-god shrine',text:'A cliff temple that rumbles when the sea god is displeased, which is often. Sailors leave offerings. Some leave sailors.'},

{id:'ribs',c:'d',x:685,y:654,icon:'ribs',s:1.3,r:30,t:1,name:'The Sky-Whale Ribs',type:'Wonder',text:'The skeleton of a creature that swam through the sky when the desert was an ocean. Caravans shelter in its ribs and tell stories about its death. The stories disagree.'},

{id:'dustgate',c:'d',x:335,y:702,icon:'gate',s:1,r:26,t:1,name:'Dust Gate',type:'West customs',text:'The western gate where turtles are counted, loads weighed and bribes graded by size.'},

{id:'saltflats',c:'d',x:738,y:754,icon:'saltflat',s:1,r:30,t:1,name:'The Bleached Flats',type:'Salt flat',text:'A white plain that holds the heat and throws the sun into travellers\' eyes. Mirages here are generous and malicious.'},

{id:'widowrest',c:'h',x:416,y:266,icon:'inn',s:1,r:24,t:1,name:"Widow's Rest",type:'Roadside inn',text:'A warm inn at the foot of the Frostmelt, run by a widow who has buried three husbands and is considering the fourth.'},

function jag(poly,amp,iters){let p=poly.slice();for(let k=0;k<iters;k++){const q=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];q.push(a);const dx=b[0]-a[0],dy=b[1]-a[1],Ln=Math.hypot(dx,dy)||1,o=(R()-.5)*amp*Ln;q.push([(a[0]+b[0])/2-dy/Ln*o,(a[1]+b[1])/2+dx/Ln*o])}p=q;amp*=.62}return p}
function spline(p){const n=p.length;let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d+'Z'}
function openSpline(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function inPoly(p,x,y){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function blob(cx,cy,rx,ry,n=11){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=.82+R()*.3;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return p}
const meas=document.createElementNS(NS,'path');
function along(pts,f){const d=openSpline(pts);meas.setAttribute('d',d);const t=meas.getTotalLength(),a=meas.getPointAtLength(t*f),b=meas.getPointAtLength(Math.min(t,t*f+2));return{x:a.x,y:a.y,dir:b.x>=a.x?1:-1,ang:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}}
function bbox(p){const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);return[Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)]}

  /* sea waves */
  const seaPts=[];
  for(let k=0;k<500&&seaPts.length<80;k++){const x=20+R()*(W-40),y=20+R()*(H-40);if(inLand(x,y)||landPolys.some(pp=>{const b=bbox(pp);return x>b[0]-26&&x<b[1]+26&&y>b[2]-26&&y<b[3]+26&&inPoly(pp,x,y)}))continue;if(x<390&&y>230&&y<610&&Math.hypot(x-195,(y-420)*1.05)<210)continue;if(PLACES.some(p=>p.c==='s'&&Math.hypot(p.x-x,p.y-y)<46))continue;seaPts.push([x,y])}

ST({id:'d9',reg:'d',at:[690,722],name:'The Sandglass Sentinel',kind:'mini',xp:160,

 les:'To read a macro, <b>act as the computer</b> and write down the variables after each pass. <code>For i = 1 To 5 … Next i</code> repeats the lines between them with i = 1, then 2, up to 5. <code>x Mod 2</code> is the <b>remainder</b> after dividing x by 2: 1 for odd numbers, 0 for even ones (so <code>Mod 2 = 1</code> means "is odd"). <code>If test Then action</code> runs the action only when the test is TRUE. <code>total = total + i</code> adds i to the running total. <code>MsgBox</code> shows a value in a pop-up. Make a small table: one row per i, one column for each variable that changes.',

  RD('agr3',{ty:'pred',tx:'<b>Entry three.</b> Brackets matter.',q:'What number does <code>D1</code> show?',d:{A1:6,B1:4,C1:3,D1:'=A1+B1*C1-(A1-B1)'},tgt:'D1',show:'D1:  =A1+B1*C1-(A1-B1)   with A1 = 6, B1 = 4, C1 = 3'})]});
NW({id:'a6b',reg:'a',ord:65,name:'Is It Bigger?',xp:60,
 intro:'Bobbin\'s apprentice cannot yet tell whether a loom beat its target. "I just feel it," he says. Excel does not feel. It tests.',
 les:'A comparison like <code>B2&gt;C2</code> is a question. Excel answers with <b>TRUE</b> or <b>FALSE</b>. That answer is what IF reads. <code>=B2&gt;=C2</code> is TRUE when B2 is bigger <i>or equal</i>. Practise asking the question before wrapping it in IF.',
 rounds:[
  RD('a6br1',{ty:'pred',q:'What does <code>C1</code> display?',d:{A1:7,B1:7,C1:'=A1>B1'},tgt:'C1',show:'C1:  =A1>B1   with A1 = 7 and B1 = 7'}),
  RD('a6br2',{ty:'f',q:'Fill <code>D2:D5</code> with <b>TRUE</b> if the sales in B beat the target in C (strictly more), otherwise FALSE.',d:G([['Loom','Sales','Target','Beat?'],['A',12,10],['B',8,8],['C',5,9],['D',20,15]]),tgt:'D2',tgtR:['D2','D5'],sol:'=B2>C2',vary:['B2:C5']})]});
/* ---- SUNSCAR ---- */
NW({id:'d1b',reg:'d',ord:15,name:'The Phone-Book Stall',xp:60,
 intro:'A stall-keeper hands you a battered price list and a question: "If I say Salt, what do you say back?" He has asked this of four hundred customers and trusts none of them.',
 les:'A VLOOKUP is a chain of three actions: <b>find</b> the key in the first column, <b>move across</b> the number of columns you ask for, <b>read</b> the cell. Count columns from the table\'s own first column (1 = the key column, 2 = the next one).',
 rounds:[
  RD('d1br1',{ty:'pred',q:'What does <code>F2</code> display?',d:M(G([['Goods','Price'],['Saffron',48],['Salt',6],['Dates',12]]),{E2:'Salt',F2:'=VLOOKUP(E2,A2:B4,2,FALSE)'}),tgt:'F2',show:'F2:  =VLOOKUP(E2,A2:B4,2,FALSE)   with E2 = "Salt"'}),
  RD('d1br2',{ty:'pick',q:'In <code>=VLOOKUP(E2,A2:C4,3,FALSE)</code> what does the <b>3</b> mean?',d:G([['Goods','Price','Stock'],['Saffron',48,10],['Salt',6,200],['Dates',12,35]]),tgt:'F2',opts:['Search for the value in column C','Return the value from the 3rd column of the table (C)','Look for the value 3 times','Skip 3 rows down'],ans:1,why:'Count from the first column of the table: A = 1, B = 2, C = 3.'})]});
NW({id:'d2b',reg:'d',ord:25,name:'Which Row Is It?',xp:70,
 intro:'The turtle herder does not want the load. He wants to know <i>which turtle in the line</i> carries it: "third from the front, second from the back". Position, not value.',
 les:'<code>MATCH(value, range, 0)</code> answers "<b>which position</b> in this list is the value at?". The first item is position 1. The final <code>0</code> demands an exact match. It is half of INDEX + MATCH: first find the position, then fetch what you want from that position.',
 rounds:[RD('d2br',{ty:'f',q:'In <code>F2</code> return the <b>position</b> (1 for the first name, 2 for the second…) of the turtle named in <code>E2</code> within the list <code>A2:A7</code>.',d:M(G([['Turtle'],['Brine'],['Pearl'],['Quill'],['Marrow'],['Dune'],['Hush']]),{E2:'Quill'}),tgt:'F2',sol:'=MATCH(E2,A2:A7,0)',shuf:'A2:A7'})]});
NW({id:'d3b',reg:'d',ord:35,name:'Two Keys, One Gate',xp:70,
 intro:'The Dune Gate has a new rule: some caravans pass on weight alone, others need a permit as well. The gatekeeper refuses to say which, so you must write down both versions.',
 les:'<code>AND(test1, test2)</code> is TRUE only when <b>both</b> are TRUE. <code>OR(test1, test2)</code> is TRUE when <b>at least one</b> is. They go inside IF\'s first slot: <code>=IF(AND(B2&lt;50,C2="Yes"),"Open","Closed")</code>.',
 rounds:[
  RD('d3br1',{ty:'f',q:'Fill <code>D2:D6</code>: <b>Open</b> if the weight is under 50 <b>and</b> the permit (column C) is "Yes"; otherwise <b>Closed</b>.',d:G([['Caravan','Weight','Permit','Gate'],['Spice',42,'Yes'],['Brick',70,'Yes'],['Water',30,'No'],['Salt',48,'Yes'],['Silk',12,'No']]),tgt:'D2',tgtR:['D2','D6'],sol:'=IF(AND(B2<50,C2="Yes"),"Open","Closed")',vary:'B2:B6'}),
  RD('d3br2',{ty:'f',q:'Same table, new rule. Fill <code>D2:D6</code>: <b>Open</b> if the weight is under 50 <b>or</b> the permit is "Yes"; otherwise <b>Closed</b>.',d:G([['Caravan','Weight','Permit','Gate'],['Spice',42,'Yes'],['Brick',70,'Yes'],['Water',30,'No'],['Salt',48,'Yes'],['Silk',72,'No']]),tgt:'D2',tgtR:['D2','D6'],sol:'=IF(OR(B2<50,C2="Yes"),"Open","Closed")',vary:'B2:B6'})]});
NW({id:'dg',reg:'d',ord:37,kind:'mini',name:'The Dune Gatekeeper',xp:160,
 intro:'A carved gatekeeper with the face of a tired accountant steps out of the sand. "You have learned to find things and to decide. Show me both. Three tests."',
 rounds:[
  RD('dgr1',{ty:'f',tx:'<b>Test one.</b> Find to the left.',q:'In <code>F2</code> return the load (column A) carried by the turtle named in <code>E2</code> (names are in column B). Use INDEX with MATCH.',d:M(G([['Load','Turtle'],[320,'Brine'],[410,'Pearl'],[275,'Quill'],[390,'Marrow']]),{E2:'Quill'}),tgt:'F2',sol:'=INDEX(A2:A5,MATCH(E2,B2:B5,0))',shuf:'B2:B5',vary:'A2:A5'}),
  RD('dgr2',{ty:'pred',tx:'<b>Test two.</b> A tier lookup.',q:'What does <code>D2</code> display? With a final <code>TRUE</code>, VLOOKUP returns the row with the biggest value that is not above the key.',d:M(G([[0,'Small'],[50,'Medium'],[80,'Large']],'A1'),{C2:65,D2:'=VLOOKUP(C2,A1:B3,2,TRUE)'}),tgt:'D2',show:'D2:  =VLOOKUP(C2,A1:B3,2,TRUE)   with C2 = 65 and the table in A1:B3 (0 Small, 50 Medium, 80 Large)'}),
  RD('dgr3',{ty:'f',tx:'<b>Test three.</b> Either way in.',q:'Fill <code>D2:D6</code>: <b>Enter</b> if the load is at most 60 <b>and</b> there are at least 2 turtles, <b>or</b> the permit is "Yes"; otherwise <b>Stay out</b>.',d:G([['Caravan','Load','Turtles','Permit','Ruling'],['Amber',55,3,'No'],['Brick',90,5,'Yes'],['Dates',40,1,'No'],['Spice',60,2,'No'],['Salt',95,6,'No']]),tgt:'E2',tgtR:['E2','E6'],sol:'=IF(OR(AND(B2<=60,C2>=2),D2="Yes"),"Enter","Stay out")',vary:['B2:B6','C2:C6']})]});
NW({id:'d4b',reg:'d',ord:45,name:'Two Conditions at Once',xp:75,
 intro:'The cistern clerk wants totals by district, then by district <i>and</i> season. "One condition I can do with my eyes closed," he says, closing them. "Two, I need help."',
 les:'<code>SUMIF(range, criteria, sum_range)</code> adds the numbers from <code>sum_range</code> where <code>range</code> matches one test. For <b>two or more</b> tests, use <code>SUMIFS(sum_range, range1, crit1, range2, crit2)</code>. Notice the sum range comes <b>first</b> in SUMIFS.',
 rounds:[
  RD('d4br1',{ty:'f',q:'In <code>F2</code> add up the litres (column C) for the <b>Upper</b> district only. One condition: use SUMIF.',d:G([['District','Season','Litres'],['Upper','Spring',40],['Lower','Spring',65],['Upper','Summer',30],['Lower','Summer',25],['Upper','Spring',55],['Lower','Spring',15]]),tgt:'F2',sol:'=SUMIF(A2:A7,"Upper",C2:C7)',pool:[['A2:A7',['Upper','Lower']]],vary:'C2:C7'}),
  RD('d4br2',{ty:'f',q:'In <code>F2</code> add up the litres for <b>Upper</b> district in <b>Spring</b> only. Two conditions: use SUMIFS.',d:G([['District','Season','Litres'],['Upper','Spring',40],['Lower','Spring',65],['Upper','Summer',30],['Lower','Summer',25],['Upper','Spring',55],['Lower','Spring',15]]),tgt:'F2',sol:'=SUMIFS(C2:C7,A2:A7,"Upper",B2:B7,"Spring")',pool:[['A2:A7',['Upper','Lower']],['B2:B7',['Spring','Summer']]],vary:'C2:C7'})]});
NW({id:'d8b',reg:'d',ord:85,name:'Number or Just Text?',xp:80,
 intro:'The oasis scribe imported his figures from an old scroll. They look like numbers. They behave like words. The scribe does not see the difference. Excel does.',
 les:'Text that <i>looks</i> like a number is still text. <code>SUM</code> ignores it. <code>VALUE(text)</code> converts it to a real number. If a unit is stuck to it ("12kg"), remove the unit with <code>SUBSTITUTE(text, "kg", "")</code> first, then wrap in <code>VALUE</code>.',
 rounds:[
  RD('d8br1',{ty:'f',q:'Fill <code>B2:B5</code> with the real <b>number</b> for each text entry in column A (they are stored as text).',d:G([['Text','Number'],['12'],['7'],['150'],['23']]),tgt:'B2',tgtR:['B2','B5'],sol:'=VALUE(A2)',vary:'A2:A5'}),
  RD('d8br2',{ty:'f',q:'Fill <code>B2:B5</code> with the number from entries like <b>"12kg"</b>: remove the "kg", then convert to a number.',d:G([['Weight','Number'],['12kg'],['7kg'],['150kg'],['23kg']]),tgt:'B2',tgtR:['B2','B5'],sol:'=VALUE(SUBSTITUTE(A2,"kg",""))'})]});

NW({id:'m0',reg:'m',ord:5,name:'The Threshold Stall',xp:85,
 intro:'At the foot of Elysion a satyr runs a stall of exact prices. He has heard that mortals use something called XLOOKUP and is deeply suspicious of anything with an X in it.',
 les:'<code>XLOOKUP(value, look_range, return_range)</code> is the modern lookup. You give it <b>two separate ranges</b>: the one to search, and the one to answer from. It matches exactly by default and you can add a fourth argument for the "not found" message: <code>XLOOKUP(E2, A2:A6, B2:B6, "unknown")</code>.',
 rounds:[
  RD('m0r1',{ty:'f',q:'In <code>F2</code> use XLOOKUP to return the price (column B) of the item named in <code>E2</code> (names are in column A).',d:M(G([['Item','Price'],['Olive',3],['Fig',5],['Wine',12],['Honey',8],['Bread',2]]),{E2:'Honey'}),tgt:'F2',sol:'=XLOOKUP(E2,A2:A6,B2:B6)',shuf:'A2:A6',vary:'B2:B6'}),
  RD('m0r2',{ty:'f',q:'In <code>F3</code> do the same for the item in <code>E3</code>, but return <b>unknown</b> if it is not in the list.',d:M(G([['Item','Price'],['Olive',3],['Fig',5],['Wine',12],['Honey',8],['Bread',2]]),{E3:'Ambrosia'}),tgt:'F3',sol:'=XLOOKUP(E3,A2:A6,B2:B6,"unknown")',vary:'B2:B6',pool:[['E3',['Olive','Fig','Ambrosia','Honey','Nectar','Wine'],1]]})]});
NW({id:'m2b',reg:'m',ord:25,name:'The Truth Counter',xp:90,
 intro:'The barracks drill-master wants to know how many soldiers pass the strength test, "without writing down every name, because names make them cocky".',
 les:'<code>B2:B9&gt;50</code> is not one answer: it is a <b>column of TRUE/FALSE</b>, one per row. The double minus <code>--</code> turns TRUE into 1 and FALSE into 0. <code>SUMPRODUCT</code> then adds them up. So <code>=SUMPRODUCT(--(B2:B9&gt;50))</code> <b>counts</b> the rows that pass the test.',
 rounds:[
  RD('m2br1',{ty:'f',q:'In <code>E2</code> count how many strengths in <code>B2:B9</code> are <b>above 50</b>. Use SUMPRODUCT with <code>--</code>.',d:G([['Soldier','Strength'],['Leonidas',95],['Dienekes',62],['Aristodemos',38],['Pantites',71],['Alpheus',45],['Maron',58],['Eurytus',33],['Brasidas',88]]),tgt:'E2',sol:'=SUMPRODUCT(--(B2:B9>50))',vary:'B2:B9'}),
  RD('m2br2',{ty:'pred',q:'What number does <code>D2</code> display?',d:M(G([['Soldier','Strength'],['A',4],['B',10],['C',15],['D',9],['E',10]]),{D2:'=SUMPRODUCT(--(B2:B6>=10))'}),tgt:'D2',show:'D2:  =SUMPRODUCT(--(B2:B6>=10))'})]});
NW({id:'m3b',reg:'m',ord:35,name:'Rank Order at the Isle',xp:90,
 intro:'The nymphs argue about who is the most beautiful. The Isle\'s records clerk, who values his life, wants the list sorted by score and nothing else.',
 les:'<code>SORT(array, sort_column, order)</code> sorts a whole table. <code>sort_column</code> is a number (1 = first column of the table). <code>order</code> is <code>1</code> for A to Z / smallest first and <code>-1</code> for Z to A / largest first. The result spills.',
 rounds:[RD('m3br',{ty:'f',q:'In <code>D2</code> return the whole table <code>A2:B8</code> sorted by the <b>second column, largest first</b>. One formula; it spills.',d:G([['Nymph','Score'],['Dryad',72],['Naiad',88],['Oread',55],['Nereid',91],['Hamadryad',64],['Thetis',79],['Galene',60]]),tgt:'D2',cmp:'D2:E8',sol:'=SORT(A2:B8,2,-1)',vary:'B2:B8'})]});
NW({id:'mg',reg:'m',ord:37,kind:'mini',name:'The Olympian Gatekeeper',xp:180,
 intro:'A marble steward with a clipboard blocks the stairs. "Everyone who climbs here has to pass my little quiz. Do not be offended. It is the same quiz we gave Heracles. He failed twice."',
 rounds:[
  RD('mgr1',{ty:'f',tx:'<b>Question one.</b> Tiers.',q:'Fill <code>C2:C5</code> with each score\'s rank using the table in <code>E2:F4</code>. Pick the row with the biggest threshold <b>not above</b> the score. Use XLOOKUP with match mode <code>-1</code>.',d:M(G([['Soul','Score','Rank'],['Orpheus',92],['Midas',58],['Tantalus',21],['Ariadne',77]]),G([['From','Rank'],[0,'Mortal'],[40,'Hero'],[75,'Legend']],'E1')),tgt:'C2',tgtR:['C2','C5'],sol:'=XLOOKUP(B2,$E$2:$E$4,$F$2:$F$4,,-1)',vary:'B2:B5'}),
  RD('mgr2',{ty:'f',tx:'<b>Question two.</b> A filtered list.',q:'In <code>E2</code> list the names (column A) whose status in column B is <b>Awake</b>. One formula; it spills.',d:G([['God','Status'],['Zeus','Awake'],['Hera','Asleep'],['Ares','Awake'],['Pan','Asleep'],['Nike','Awake'],['Hades','Awake']]),tgt:'E2',cmp:'E2:E7',sol:'=FILTER(A2:A7,B2:B7="Awake")',pool:[['B2:B7',['Awake','Asleep','Awake'],1]]}),
  RD('mgr3',{ty:'pred',tx:'<b>Question three.</b> Unique, then sorted.',q:'What does <code>D2</code> display? Think: remove duplicates, sort A to Z, take the first item.',d:M(G([['Name'],['Nike'],['Ares'],['Nike'],['Hera'],['Ares'],['Apollo']]),{D2:'=INDEX(SORT(UNIQUE(A2:A7)),1)'}),tgt:'D2',show:'D2:  =INDEX(SORT(UNIQUE(A2:A7)),1)'})]});
NW({id:'m4b',reg:'m',ord:45,name:'The Monks\' First Script',xp:95,
 intro:'A monk hands you a short script in a jar. "It counts the tithes above a certain size. We do not remember what size. Please read it and tell us. Please also do not drop the jar."',
 les:'<b>Office Scripts</b> automate Excel on the web. <code>sheet.getCell(row, column)</code> grabs a cell, but both numbers start at <b>0</b>: <code>getCell(0,0)</code> is A1, <code>getCell(0,1)</code> is B1. <code>.getValue()</code> reads it, <code>.setValue(x)</code> writes to it. <code>console.log(x)</code> prints a result. Read it like any loop: make a table of the variables, one row per pass.',
 rounds:[
  RD('m4br1',{ty:'code',q:'Cells <b>A1:A4</b> hold 4, 9, 2, 7. What does the script log?',code:['function main(workbook: ExcelScript.Workbook) {','  let sheet = workbook.getActiveWorksheet();','  let count = 0;','  for (let r = 0; r < 4; r++) {','    let v = sheet.getCell(r, 0).getValue() as number;','    if (v > 5) { count++; }','  }','  console.log(count);','}'],ans:'2',exp:'r runs 0..3, reading A1..A4. Only 9 and 7 are above 5, so count is 2.'}),
  RD('m4br2',{ty:'bug',q:'This script should write the total of <b>A1:A3</b> into <b>B1</b>. It overwrites the wrong cell. Which line is the bug?',code:['function main(workbook: ExcelScript.Workbook) {','  let sheet = workbook.getActiveWorksheet();','  let total = 0;','  for (let r = 0; r < 3; r++) {','    total += sheet.getCell(r, 0).getValue() as number;','  }','  sheet.getCell(1, 0).setValue(total);','}'],ans:7,exp:'<code>getCell(row, column)</code>: B1 is row 0, column 1, so <code>getCell(0, 1)</code>. <code>(1, 0)</code> is A2.'})]});
NW({id:'m6b',reg:'m',ord:65,name:'The Ladder of Rules',xp:100,
 intro:'The satyr vintners grade every cask. Ninety and over is the best, seventy-five is good, sixty is passable, anything below is vinegar. Long chains of nested IFs give them headaches.',
 les:'<code>IFS(test1, result1, test2, result2, …)</code> checks the tests <b>in order</b> and returns the result of the <b>first TRUE</b>. End with <code>TRUE, "default"</code> so everything else has an answer. Order the tests from strictest to loosest, or an early loose test steals the answer.',
 rounds:[RD('m6br',{ty:'f',q:'Fill <code>C2:C6</code> with a grade using IFS: 90 or above = <b>A</b>; 75 or above = <b>B</b>; 60 or above = <b>C</b>; anything else = <b>F</b>.',d:G([['Cask','Score','Grade'],['Rosso',93],['Bianco',78],['Retsina',61],['Mead',44],['Amber',75]]),tgt:'C2',tgtR:['C2','C6'],sol:'=IFS(B2>=90,"A",B2>=75,"B",B2>=60,"C",TRUE,"F")',vary:'B2:B6'})]});
/* ---- HOARFROST SPINE ---- */
NW({id:'h0',reg:'h',ord:5,name:'The Frozen Grid',xp:105,
 intro:'A yeti with frost on its eyebrows pins a grid to a rock. "Row, column, cell. Row, column, cell. Say it with me, or the spring melt will find you."',
 les:'<code>INDEX(range, row, column)</code> returns the cell where the given row and column of the range cross. <code>INDEX(B2:D5, 3, 2)</code> means "inside B2:D5, go to the 3rd row and 2nd column". Counting starts at 1 <b>inside the range</b>, not on the sheet.',
 rounds:[
  RD('h0r1',{ty:'f',q:'In <code>F2</code> return the cell at the <b>3rd row</b> and <b>2nd column</b> of the range <code>B2:D5</code> using INDEX.',d:G([['Route','Light','Medium','Heavy'],['Pass',10,25,60],['Ridge',15,30,75],['Glacier',20,45,110],['Crevasse',35,70,150]]),tgt:'F2',sol:'=INDEX(B2:D5,3,2)',vary:'B2:D5'}),
  RD('h0r2',{ty:'pred',q:'What number does <code>E2</code> display?',d:M(G([[5,6,7],[8,9,10],[11,12,13]],'A2'),{E2:'=INDEX(A2:C4,2,3)'}),tgt:'E2',show:'E2:  =INDEX(A2:C4,2,3)'})]});
NW({id:'h1b',reg:'h',ord:15,name:'After the Dash',xp:110,
 intro:'The yeti toll clerks tag every crate "Species-Number". The oak scribes want only one half, and they refuse to say which half until you ask nicely.',
 les:'<code>TEXTAFTER(text, "-")</code> returns everything <b>after</b> the first dash. <code>TEXTBEFORE(text, "-")</code> returns everything <b>before</b> it. You may add a third argument for which occurrence: <code>TEXTAFTER(A2,"|",2)</code> returns the text after the second bar.',
 rounds:[
  RD('h1br1',{ty:'f',q:'Fill <code>B2:B5</code> with the part of each code <b>after</b> the dash (the number).',d:G([['Code','Number'],['Oak-412'],['Ash-87'],['Yew-1260'],['Elm-35']]),tgt:'B2',tgtR:['B2','B5'],sol:'=TEXTAFTER(A2,"-")'}),
  RD('h1br2',{ty:'f',q:'Fill <code>B2:B5</code> with the part of each code <b>before</b> the dash (the species).',d:G([['Code','Species'],['Oak-412'],['Ash-87'],['Yew-1260'],['Elm-35']]),tgt:'B2',tgtR:['B2','B5'],sol:'=TEXTBEFORE(A2,"-")'})]});
NW({id:'h3b',reg:'h',ord:35,name:'Second Place Among Dragons',xp:115,
 intro:'The Frostbite commander only ever asks about the biggest stretch. A smart quartermaster would ask about the second biggest, because that is the one that kills you.',
 les:'<code>LARGE(range, k)</code> returns the <b>k-th largest</b> value: <code>k = 1</code> is the maximum, <code>k = 2</code> the second largest. <code>SMALL(range, k)</code> does the same from the small end. They return the <i>value</i>; to find <i>which row</i> holds it, combine with MATCH.',
 rounds:[
  RD('h3br1',{ty:'f',q:'In <code>E2</code> return the <b>2nd largest</b> value in <code>B2:B8</code>.',d:G([['Stretch','Cases'],['Upper col',14],['Ice stair',31],['Rimefall',9],['Narrow ledge',22],['Whiteout bowl',27],['Camp ridge',5],['Hollow',18]]),tgt:'E2',sol:'=LARGE(B2:B8,2)',vary:'B2:B8'}),
  RD('h3br2',{ty:'f',q:'In <code>E3</code> return the <b>3rd smallest</b> value in <code>B2:B8</code>.',d:G([['Stretch','Cases'],['Upper col',14],['Ice stair',31],['Rimefall',9],['Narrow ledge',22],['Whiteout bowl',27],['Camp ridge',5],['Hollow',18]]),tgt:'E3',sol:'=SMALL(B2:B8,3)',vary:'B2:B8'})]});
NW({id:'hg',reg:'h',ord:37,kind:'mini',name:'The Rimefang Gatekeeper',xp:200,

/* ===== ORDER + MAP PLACEMENT for new stops ===== */
(function(){
 STOPS.forEach(s=>{if(s.ord==null)s.ord=parseInt(s.id.slice(1))*10});
 const order=['a','d','m','h'];
 STOPS.sort((x,y)=>{const rx=order.indexOf(x.reg),ry=order.indexOf(y.reg);return rx-ry||x.ord-y.ord});
 for(const r of order){
  const L=STOPS.filter(s=>s.reg===r);let flip=1;
  L.forEach((s,i)=>{
   if(s.at)return;
   let p=null,n=null;
   for(let j=i-1;j>=0;j--)if(L[j].at){p=L[j];break}
   for(let j=i+1;j<L.length;j++)if(L[j].at){n=L[j];break}
   if(p&&n){const t=(s.ord-p.ord)/(n.ord-p.ord);
    const x=p.at[0]+(n.at[0]-p.at[0])*t,y=p.at[1]+(n.at[1]-p.at[1])*t;
    const dx=n.at[0]-p.at[0],dy=n.at[1]-p.at[1],d=Math.hypot(dx,dy)||1;
    s.at=[Math.round(x-dy/d*10*flip),Math.round(y+dx/d*10*flip)];flip=-flip}
   else if(n){const q=L.find(z=>z.at&&z!==n&&z.ord>n.ord)||n;
    s.at=[Math.round(n.at[0]-(q.at[0]-n.at[0])*.5),Math.round(n.at[1]-(q.at[1]-n.at[1])*.5)]}
  });
 }
})();

 H.forEach((s,i)=>{let p=at(H.length>1?i/(H.length-1):0),k=0;while(!inside(p[0],p[1])&&k<60){p=[p[0]+(620-p[0])*.06,p[1]+(130-p[1])*.06];k++}s.at=[Math.round(p[0]),Math.round(p[1])]});
})();

/* ===== SCRIPTURE: how Excel thinks ===== */
const SCRIPT=[
{id:'cells',t:'1. Cells, values and formulas',b:`<p>A spreadsheet is a grid of boxes called <b>cells</b>. Each has an address: column letter first, then row number. <code>B3</code> is column B, row 3.</p>
<p>A cell holds either a <b>value</b> (the number 14, the word Eel) or a <b>formula</b>. A formula always starts with <code>=</code>. That is how Excel knows you want it to <i>calculate</i> rather than just store text.</p>
<p><b>The big idea:</b> a formula does not store an answer. It stores a <i>recipe</i>. Change a number the recipe points at and the answer changes by itself. This is why you point at cells instead of typing numbers: <code>=B2*3</code> is alive; <code>=42</code> is dead.</p>
<p><b>Mini-test:</b> if B2 is 14, what does <code>=B2+1</code> show? 15. If B2 becomes 20? 21, without you touching the formula.</p>`},
{id:'refs',t:'2. Ranges, filling down and the dollar sign',b:`<p>A <b>range</b> is a block of cells: <code>B2:B7</code> means "from B2 down to B7, every cell". Functions like SUM take ranges.</p>
<p><b>Filling down.</b> You write a formula once and copy it down the column. Excel shifts the row numbers for you: <code>=B2*C2</code> becomes <code>=B3*C3</code>, then <code>=B4*C4</code>. These are <b>relative references</b>: they move with the formula.</p>
<p>Sometimes a reference must <i>not</i> move, like a single tax rate in <code>E2</code>. Lock it with dollar signs: <code>$E$2</code>. Think of <code>$</code> as a nail: it pins the column (<code>$E</code>) and the row (<code>$2</code>).</p>
<p><b>Rule of thumb:</b> the thing that changes per row stays relative (<code>A2</code>); the thing that is the same for every row gets nails (<code>$E$2</code>). A table you look things up in is almost always nailed: <code>$A$2:$B$7</code>.</p>
<p><b>Check yourself:</b> if a formula works in row 2 and breaks lower down, a missing <code>$</code> is the first suspect.</p>`},
{id:'ops',t:'3. Operators and order of operations',b:`<p>Excel does maths in a fixed order, the same as school: brackets first, then <code>^</code>, then <code>* /</code>, then <code>+ -</code>. So <code>=3+8*5</code> is 43, not 55. Use brackets to force what you mean: <code>=(3+8)*5</code> is 55.</p>
<p>Other operators you will meet:</p>
<p><code>&amp;</code> joins text: <code>="Dr. "&amp;A2</code>. <code>= &lt; &gt; &lt;= &gt;= &lt;&gt;</code> compare two things and answer TRUE or FALSE. <code>&lt;&gt;</code> means "is not equal to".</p>
<p><b>Careful with limits.</b> "At least 100" is <code>&gt;=100</code> (100 passes). "More than 100" is <code>&gt;100</code> (100 fails). Most mistakes at boundaries come from picking the wrong one. Always test the exact boundary value.</p>`},
{id:'fn',t:'4. Functions: name, brackets, arguments',b:`<p>A <b>function</b> is a ready-made tool: a name, then brackets, then <b>arguments</b> separated by commas. <code>=ROUND(2.567, 1)</code> has two arguments: the number, and how many decimals.</p>
<p><b>Text goes in quotes.</b> <code>"Eel"</code> is text. Without quotes Excel thinks <code>Eel</code> is the name of something and shows <code>#NAME?</code>. Numbers and cell references never get quotes.</p>
<p><b>Placeholders are not real.</b> When a lesson shows <code>=DATE(y,m,d)</code>, the <code>y m d</code> are labels for you to replace with real values or cells.</p>
<p><b>Nesting: read from the inside out.</b> <code>=PROPER(TRIM(A2))</code>: TRIM runs first, then PROPER works on its result. Whenever you meet a long formula, find the innermost brackets and work outward, writing down each intermediate result.</p>
<p><b>Commas vs semicolons:</b> some regional versions of Excel separate arguments with <code>;</code>. This game always uses commas.</p>`},
{id:'tf',t:'5. TRUE and FALSE: how Excel decides',b:`<p>Excel makes decisions with <b>tests</b>: questions with a TRUE or FALSE answer. <code>B2&gt;=100</code> asks "is B2 at least 100?".</p>
<p><code>IF(test, result_if_true, result_if_false)</code> has exactly <b>three slots</b>. The test goes in the first. What to show goes in the other two. Nothing else fits.</p>
<p>To combine tests, use functions <i>inside</i> the first slot:</p>
<p><code>AND(t1, t2)</code>: all must be TRUE. <code>OR(t1, t2)</code>: at least one. <code>NOT(t)</code>: flips it.</p>
<p><code>=IF(OR(AND(B2&lt;=80,C2&gt;=3),D2="Yes"),"Enter","Turn back")</code></p>
<p><b>How to build one:</b> (1) say the rule in plain words, (2) write each piece as a test, (3) join the tests with AND / OR, (4) wrap the whole thing in IF. The words "and", "or" in the rule become the functions AND, OR.</p>
<p><b>Three or more outcomes:</b> put another IF in the "false" slot: <code>IF(B2&lt;10,"Small",IF(B2&lt;50,"Medium","Large"))</code>. Excel stops at the first TRUE, so order the tests from smallest to largest.</p>`},
{id:'cond',t:'6. Counting and adding with a condition',b:`<p>Often you want "only the rows where…". The IF family does that:</p>
<p><code>COUNTIF(range, criteria)</code>: how many match.<br><code>SUMIF(range, criteria, sum_range)</code>: add up <i>another column</i> for the matching rows.<br><code>AVERAGEIF</code>: the average of the matching rows.</p>
<p><b>Criteria</b> is the rule. Text in quotes: <code>"Eel"</code>. A comparison also in quotes: <code>"&gt;50"</code>. A cell reference: <code>E2</code>.</p>
<p><b>Picture it:</b> SUMIF walks down two columns side by side. Where the first column passes the test, it grabs the number from the second column. That is why the two ranges must be the same height.</p>
<p><b>Several conditions:</b> the plural versions (<code>SUMIFS</code>, <code>COUNTIFS</code>, <code>AVERAGEIFS</code>, <code>MAXIFS</code>) take pairs of range and criteria, and a row counts only if it passes <b>all</b> of them. In SUMIFS and MAXIFS the range you want the answer from comes <b>first</b>.</p>`},
{id:'look',t:'7. Lookups: finding a thing by its name',b:`<p>A lookup answers: "given this key, what is the matching value in my table?" Like a phone book: find the name, read across.</p>
<p><b>VLOOKUP(key, table, col, 0)</b>: searches the <i>first column</i> of the table downward, then moves <code>col</code> columns to the right on that row. The <code>0</code> means exact match. Always include it.</p>
<p><b>INDEX + MATCH:</b> <code>MATCH(key, range, 0)</code> tells you <i>which position</i> the key is at. <code>INDEX(range, position)</code> gives you the item at that position, in any column, even left of the key.</p>
<p><b>XLOOKUP(key, look_range, return_range, if_not_found)</b>: you give two separate ranges, one to search and one to answer from. Exact by default, any direction, and a built-in "not found" message.</p>
<p><b>Approximate (tier) lookups:</b> sorted thresholds like 0, 50, 70, 85. You get the row with the biggest threshold <i>not above</i> your value. 74 lands on 70.</p>
<p><b>Errors:</b> <code>#N/A</code> means the key was not found. Wrap in <code>IFERROR(…, "text")</code> to give a friendly answer. Note that IFERROR must wrap the <i>whole</i> lookup.</p>`},
];
SCRIPT.push(
{id:'text',t:'8. Text is data too',b:`<p>Text in Excel is just characters in a row, and functions can cut and join them. <code>LEFT(text, n)</code> takes the first n characters, <code>RIGHT</code> the last n, <code>MID(text, start, n)</code> takes n characters starting at a position (1 = the first character).</p>
<p><code>LEN</code> counts characters. <code>FIND("-", text)</code> returns the position of a character, which lets you cut at a spot that moves: <code>=LEFT(A2, FIND("-",A2)-1)</code> means "everything before the dash".</p>
<p><b>Cleaning chain:</b> <code>TRIM</code> removes stray spaces, <code>PROPER / UPPER / LOWER</code> fix capitals, <code>SUBSTITUTE(text, old, new)</code> replaces pieces. Chain them from the inside out.</p>
<p><b>Text that looks like a number is NOT a number.</b> The cell may show 12, but if it is stored as text Excel cannot add it. <code>VALUE("12")</code> turns number-looking text into a real number. After removing units like "kg" with SUBSTITUTE, wrap the result in VALUE to make it usable.</p>`},
{id:'date',t:'9. Dates are numbers',b:`<p>Behind the scenes every date is a plain number: the count of days since 1900. Today is around 46000. That is why you can add days (<code>=A2+90</code>) or compare dates (<code>A2&lt;B2</code>) just like numbers.</p>
<p><code>DATE(2025,3,4)</code> builds a date. <code>YEAR</code>, <code>MONTH</code>, <code>DAY</code> take one apart.</p>
<p><code>TEXT(date, "mmm")</code> <b>displays</b> a date as text in a format you choose: <code>"mmm"</code> gives Mar, <code>"mmmm"</code> gives March, <code>"yyyy"</code> the year, <code>"dd/mm/yyyy"</code> a full date.</p>
<p>If a cell shows 45720 where you expected a date, nothing is broken. It is a date shown without date formatting.</p>`},
{id:'arr',t:'10. Arrays, spilling and naming',b:`<p>Modern Excel can return <b>a whole list</b> from one formula. The results <b>spill</b> into the cells below and beside the formula cell. You write it once in the top-left cell.</p>
<p><code>FILTER(table, test)</code>: keep only rows where the test is TRUE. <code>SORT(range, col, order)</code> sorts. <code>UNIQUE(range)</code> removes duplicates. They nest: <code>=SORT(UNIQUE(A2:A9))</code> removes duplicates first, then sorts.</p>
<p><b>Think in whole columns.</b> <code>B2:B9&gt;50</code> is not one answer; it is a column of TRUE/FALSE, one per row. FILTER uses that column to decide which rows survive. Multiplying such columns (<code>(A2:A9="Red")*B2:B9</code>) turns TRUE into 1 and FALSE into 0, which is what SUMPRODUCT adds up.</p>
<p><b>LET</b> gives a name to a calculation you reuse: <code>=LET(t, SUM(B2:B7), IF(t&gt;500, t*0.9, t))</code>. Read it as "let t be the sum, then do this with t". The name lives only inside that formula.</p>`},
{id:'code',t:'11. Reading VBA and Office Scripts',b:`<p>You are not asked to write macros, only to <b>read</b> them and predict what they do. The method never changes: <b>make a trace table</b>.</p>
<p>List every variable as a column. Walk through the code line by line, one pass of the loop per row, and update the values. When the loop ends, the answer is in the table.</p>
<p><b>Loops:</b> <code>For i = 1 To 5</code> repeats with i = 1, 2, 3, 4, 5. In Office Scripts <code>for (let r = 0; r &lt; 4; r++)</code> repeats with r = 0, 1, 2, 3. <b>Stop before 4</b>, because <code>&lt;</code> excludes the limit.</p>
<p><b>Zero-based vs one-based:</b> VBA counts from 1 (<code>Cells(1,1)</code> is A1). Office Scripts count from 0 (<code>getCell(0,0)</code> is A1).</p>
<p><b>Handy bits:</b> <code>x Mod 2 = 1</code> means x is odd. <code>If … Then</code> runs a line only when its test is TRUE. <code>Exit For</code> leaves the <i>innermost</i> loop immediately.</p>
<p><b>Finding a bug:</b> read each line and ask "what exactly does this do?" Common culprits: the wrong column number, a loop that stops one row short, and a comparison pointing the wrong way (<code>&lt;</code> instead of <code>&gt;</code>).</p>`},
{id:'dbg',t:'12. How to debug a formula',b:`<p>When a formula misbehaves, do not guess. Run this checklist:</p>
<p><b>1. Read the error.</b> <code>#NAME?</code>: something is misspelled or text lacks quotes. <code>#N/A</code>: a lookup found nothing. <code>#DIV/0!</code>: divided by zero or blank. <code>#VALUE!</code>: wrong type of input. <code>#REF!</code>: pointing at a cell that does not exist.</p>
<p><b>2. Evaluate from the inside out.</b> Work out the innermost bracket by hand, then the next, with real numbers from the cells.</p>
<p><b>3. Check the rows below.</b> Works in row 2 but not row 5? A missing <code>$</code>, or a reference that drifted.</p>
<p><b>4. Check argument order.</b> SUMIFS wants the sum range first, SUMIF wants it last. VLOOKUP wants a column <i>number</i>; XLOOKUP wants a <i>range</i>.</p>
<p><b>5. Test the boundary.</b> Try the exact value where the rule changes: 100 for "at least 100".</p>`},
{id:'think',t:'13. Thinking like an analyst',b:`<p>Formulas are the easy part. The hard part is trusting the answer. Before you calculate, ask:</p>
<p><b>What belongs in this number?</b> An average that includes refunds or blanks tells a different story. Decide what counts first, then choose the function that matches.</p>
<p><b>Is the data clean?</b> Look for duplicates (<code>COUNTIF</code> above 1), text-stored numbers, stray spaces and impossible values.</p>
<p><b>Does it survive change?</b> A formula that references cells keeps working when the data changes. One with typed-in numbers does not.</p>
<p><b>Does the answer pass a sanity check?</b> If an average is bigger than your biggest value, something is wrong. Estimate roughly before trusting the cell.</p>
<p><b>Break rules into pieces.</b> A long rule chain becomes manageable when you write it in plain words first, turn each piece into a test, and combine them one layer at a time.</p>`});
